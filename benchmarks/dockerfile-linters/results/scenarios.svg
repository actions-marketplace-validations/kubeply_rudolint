<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1160" viewBox="0 0 1120 1160" role="img" aria-labelledby="title desc"><title id="title">Dockerfile linter benchmark scenarios</title><desc id="desc">Mean benchmark time by tool and scenario.</desc><style>text { fill: #cbd5e1; font: 600 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }.small { fill: #94a3b8; font-size: 12px; font-weight: 500; }.title { fill: #e2e8f0; font-size: 26px; font-weight: 800; }</style><rect width="100%" height="100%" fill="#111827"/><text class="title" x="32" y="42">Benchmark scenarios</text><text class="small" x="32" y="64">Mean seconds. Lower is better.</text><text x="32" y="84" fill="#e2e8f0">Single small Dockerfile</text><text x="308" y="116" text-anchor="end">kubeply/rudolint</text><rect x="320" y="105" width="124.5" height="14" rx="2" fill="#8b5cf6"/><text class="small" x="452.5" y="116">0.041s</text><text x="308" y="138" text-anchor="end">hadolint/hadolint</text><rect x="320" y="127" width="129.3" height="14" rx="2" fill="#64748b"/><text class="small" x="457.3" y="138">0.043s</text><text x="308" y="160" text-anchor="end">wharflab/tally</text><rect x="320" y="149" width="275.4" height="14" rx="2" fill="#14b8a6"/><text class="small" x="603.4" y="160">0.092s</text><text x="308" y="182" text-anchor="end">docker build --check</text><rect x="320" y="171" width="550.0" height="14" rx="2" fill="#0ea5e9"/><text class="small" x="878.0" y="182">0.183s</text><text x="32" y="264" fill="#e2e8f0">Single BuildKit-heavy Dockerfile</text><text x="308" y="296" text-anchor="end">kubeply/rudolint</text><rect x="320" y="285" width="79.0" height="14" rx="2" fill="#8b5cf6"/><text class="small" x="407.0" y="296">0.042s</text><text x="308" y="318" text-anchor="end">hadolint/hadolint</text><rect x="320" y="307" width="117.4" height="14" rx="2" fill="#64748b"/><text class="small" x="445.4" y="318">0.063s</text><text x="308" y="340" text-anchor="end">wharflab/tally</text><rect x="320" y="329" width="308.1" height="14" rx="2" fill="#14b8a6"/><text class="small" x="636.1" y="340">0.165s</text><text x="308" y="362" text-anchor="end">docker build --check</text><rect x="320" y="351" width="550.0" height="14" rx="2" fill="#0ea5e9"/><text class="small" x="878.0" y="362">0.294s</text><text x="32" y="444" fill="#e2e8f0">Repository with 100 generated Dockerfiles</text><text x="308" y="476" text-anchor="end">kubeply/rudolint</text><rect x="320" y="465" width="9.9" height="14" rx="2" fill="#8b5cf6"/><text class="small" x="337.9" y="476">0.089s</text><text x="308" y="498" text-anchor="end">hadolint/hadolint</text><rect x="320" y="487" width="37.9" height="14" rx="2" fill="#64748b"/><text class="small" x="365.9" y="498">0.341s</text><text x="308" y="520" text-anchor="end">wharflab/tally</text><rect x="320" y="509" width="83.0" height="14" rx="2" fill="#14b8a6"/><text class="small" x="411.0" y="520">0.745s</text><text x="308" y="542" text-anchor="end">docker build --check</text><rect x="320" y="531" width="550.0" height="14" rx="2" fill="#0ea5e9"/><text class="small" x="878.0" y="542">4.939s</text><text x="32" y="624" fill="#e2e8f0">Repository with 1,000 generated Dockerfiles</text><text x="308" y="656" text-anchor="end">kubeply/rudolint</text><rect x="320" y="645" width="46.1" height="14" rx="2" fill="#8b5cf6"/><text class="small" x="374.1" y="656">0.510s</text><text x="308" y="678" text-anchor="end">hadolint/hadolint</text><rect x="320" y="667" width="269.9" height="14" rx="2" fill="#64748b"/><text class="small" x="597.9" y="678">2.984s</text><text x="308" y="700" text-anchor="end">wharflab/tally</text><rect x="320" y="689" width="550.0" height="14" rx="2" fill="#14b8a6"/><text class="small" x="878.0" y="700">6.080s</text><text x="32" y="804" fill="#e2e8f0">JSON output for 100 generated Dockerfiles</text><text x="308" y="836" text-anchor="end">kubeply/rudolint</text><rect x="320" y="825" width="197.9" height="14" rx="2" fill="#8b5cf6"/><text class="small" x="525.9" y="836">0.275s</text><text x="308" y="858" text-anchor="end">hadolint/hadolint</text><rect x="320" y="847" width="282.7" height="14" rx="2" fill="#64748b"/><text class="small" x="610.7" y="858">0.393s</text><text x="308" y="880" text-anchor="end">wharflab/tally</text><rect x="320" y="869" width="550.0" height="14" rx="2" fill="#14b8a6"/><text class="small" x="878.0" y="880">0.765s</text><text x="32" y="984" fill="#e2e8f0">SARIF output for 100 generated Dockerfiles</text><text x="308" y="1016" text-anchor="end">kubeply/rudolint</text><rect x="320" y="1005" width="63.3" height="14" rx="2" fill="#8b5cf6"/><text class="small" x="391.3" y="1016">0.095s</text><text x="308" y="1038" text-anchor="end">hadolint/hadolint</text><rect x="320" y="1027" width="247.7" height="14" rx="2" fill="#64748b"/><text class="small" x="575.7" y="1038">0.371s</text><text x="308" y="1060" text-anchor="end">wharflab/tally</text><rect x="320" y="1049" width="550.0" height="14" rx="2" fill="#14b8a6"/><text class="small" x="878.0" y="1060">0.823s</text></svg>
