<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1160" viewBox="0 0 1120 1160" role="img" aria-labelledby="title desc"><title id="title">Dockerfile linter benchmark scenarios</title><desc id="desc">Mean benchmark time by tool and scenario.</desc><style>text { fill: #cbd5e1; font: 600 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }.small { fill: #94a3b8; font-size: 12px; font-weight: 500; }.title { fill: #e2e8f0; font-size: 26px; font-weight: 800; }</style><rect width="100%" height="100%" fill="#111827"/><text class="title" x="32" y="42">Benchmark scenarios</text><text class="small" x="32" y="64">Mean seconds. Lower is better.</text><text x="32" y="84" fill="#e2e8f0">Single small Dockerfile</text><text x="308" y="116" text-anchor="end">kubeply/rudolint</text><rect x="320" y="105" width="106.9" height="14" rx="2" fill="#8b5cf6"/><text class="small" x="434.9" y="116">0.043s</text><text x="308" y="138" text-anchor="end">hadolint/hadolint</text><rect x="320" y="127" width="111.0" height="14" rx="2" fill="#64748b"/><text class="small" x="439.0" y="138">0.045s</text><text x="308" y="160" text-anchor="end">wharflab/tally</text><rect x="320" y="149" width="232.6" height="14" rx="2" fill="#14b8a6"/><text class="small" x="560.6" y="160">0.095s</text><text x="308" y="182" text-anchor="end">docker build --check</text><rect x="320" y="171" width="550.0" height="14" rx="2" fill="#0ea5e9"/><text class="small" x="878.0" y="182">0.223s</text><text x="32" y="264" fill="#e2e8f0">Single BuildKit-heavy Dockerfile</text><text x="308" y="296" text-anchor="end">kubeply/rudolint</text><rect x="320" y="285" width="89.9" height="14" rx="2" fill="#8b5cf6"/><text class="small" x="417.9" y="296">0.047s</text><text x="308" y="318" text-anchor="end">hadolint/hadolint</text><rect x="320" y="307" width="127.2" height="14" rx="2" fill="#64748b"/><text class="small" x="455.2" y="318">0.067s</text><text x="308" y="340" text-anchor="end">wharflab/tally</text><rect x="320" y="329" width="320.9" height="14" rx="2" fill="#14b8a6"/><text class="small" x="648.9" y="340">0.169s</text><text x="308" y="362" text-anchor="end">docker build --check</text><rect x="320" y="351" width="550.0" height="14" rx="2" fill="#0ea5e9"/><text class="small" x="878.0" y="362">0.289s</text><text x="32" y="444" fill="#e2e8f0">Repository with 100 generated Dockerfiles</text><text x="308" y="476" text-anchor="end">kubeply/rudolint</text><rect x="320" y="465" width="17.6" height="14" rx="2" fill="#8b5cf6"/><text class="small" x="345.6" y="476">0.093s</text><text x="308" y="498" text-anchor="end">hadolint/hadolint</text><rect x="320" y="487" width="68.6" height="14" rx="2" fill="#64748b"/><text class="small" x="396.6" y="498">0.364s</text><text x="308" y="520" text-anchor="end">wharflab/tally</text><rect x="320" y="509" width="145.7" height="14" rx="2" fill="#14b8a6"/><text class="small" x="473.7" y="520">0.773s</text><text x="308" y="542" text-anchor="end">docker build --check</text><rect x="320" y="531" width="550.0" height="14" rx="2" fill="#0ea5e9"/><text class="small" x="878.0" y="542">2.917s</text><text x="32" y="624" fill="#e2e8f0">Repository with 1,000 generated Dockerfiles</text><text x="308" y="656" text-anchor="end">kubeply/rudolint</text><rect x="320" y="645" width="8.1" height="14" rx="2" fill="#8b5cf6"/><text class="small" x="336.1" y="656">0.515s</text><text x="308" y="678" text-anchor="end">hadolint/hadolint</text><rect x="320" y="667" width="51.9" height="14" rx="2" fill="#64748b"/><text class="small" x="379.9" y="678">3.311s</text><text x="308" y="700" text-anchor="end">wharflab/tally</text><rect x="320" y="689" width="107.1" height="14" rx="2" fill="#14b8a6"/><text class="small" x="435.1" y="700">6.827s</text><text x="308" y="722" text-anchor="end">docker build --check</text><rect x="320" y="711" width="550.0" height="14" rx="2" fill="#0ea5e9"/><text class="small" x="878.0" y="722">35.065s</text><text x="32" y="804" fill="#e2e8f0">JSON output for 100 generated Dockerfiles</text><text x="308" y="836" text-anchor="end">kubeply/rudolint</text><rect x="320" y="825" width="59.5" height="14" rx="2" fill="#8b5cf6"/><text class="small" x="387.5" y="836">0.096s</text><text x="308" y="858" text-anchor="end">hadolint/hadolint</text><rect x="320" y="847" width="233.5" height="14" rx="2" fill="#64748b"/><text class="small" x="561.5" y="858">0.376s</text><text x="308" y="880" text-anchor="end">wharflab/tally</text><rect x="320" y="869" width="550.0" height="14" rx="2" fill="#14b8a6"/><text class="small" x="878.0" y="880">0.887s</text><text x="32" y="984" fill="#e2e8f0">SARIF output for 100 generated Dockerfiles</text><text x="308" y="1016" text-anchor="end">kubeply/rudolint</text><rect x="320" y="1005" width="64.1" height="14" rx="2" fill="#8b5cf6"/><text class="small" x="392.1" y="1016">0.098s</text><text x="308" y="1038" text-anchor="end">hadolint/hadolint</text><rect x="320" y="1027" width="240.7" height="14" rx="2" fill="#64748b"/><text class="small" x="568.7" y="1038">0.367s</text><text x="308" y="1060" text-anchor="end">wharflab/tally</text><rect x="320" y="1049" width="550.0" height="14" rx="2" fill="#14b8a6"/><text class="small" x="878.0" y="1060">0.838s</text></svg>
