[package]
name = "rudolint"
version = "0.1.0"
edition = "2024"
description = "BuildKit-native Dockerfile linter"
license = "Apache-2.0"
repository = "https://github.com/kubeply/rudolint"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive"] }
ignore = "0.4.25"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"

[dev-dependencies]
assert_cmd = "2.1.1"
insta = { version = "1.44.0", features = ["json"] }
predicates = "3.1.3"
tempfile = "3.23.0"
